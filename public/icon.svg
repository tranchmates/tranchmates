<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0f1f"/><svg x="3" y="5" width="58" height="52" viewBox="22 24 196 176"><!-- ears poking out from under the hat -->
